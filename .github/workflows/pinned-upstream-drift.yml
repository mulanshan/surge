name: Pinned upstream drift

on:
  schedule:
    - cron: "29 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pinned-upstream-drift
  cancel-in-progress: true

jobs:
  check:
    if: github.repository == 'mulanshan/surge'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Compare tracking URLs with reviewed immutable pins
        run: python3 scripts/generate-managed-surge-rules.py --check-upstream --timeout 60
