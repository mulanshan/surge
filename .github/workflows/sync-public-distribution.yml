name: Sync Public Distribution

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-public-distribution
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout public distribution
        uses: actions/checkout@v4
        with:
          repository: mulanshan/surge
          path: public
          ssh-key: ${{ secrets.SURGE_PUBLIC_DEPLOY_KEY }}

      - name: Export public distribution
        run: bash source/scripts/export-public-distribution.sh "$GITHUB_WORKSPACE/public"

      - name: Commit and push public changes
        working-directory: public
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No public distribution changes."
            exit 0
          fi
          git commit -m "Sync public Surge distribution"
          git push
