name: Repository checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_revision:
        description: Exact 40-character lowercase baseline commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: surge-ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    if: github.event_name != 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' file; do
            found=1
            echo "node --check $file"
            node --check "$file"
          done < <(find rewrite scripts -type f -name '*.js' -print0 2>/dev/null)
          test "$found" -eq 1

      - name: Run JavaScript tests
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' file; do
            found=1
            echo "node $file"
            node "$file"
          done < <(find . -type f \( -name '*.test.js' -o -name '*.test.mjs' -o -name 'test.js' \) -not -path './.git/*' -print0)
          # Fail hard when the suite silently disappears (glob or rename drift).
          test "$found" -eq 1

      - name: Check Python syntax and tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts .github/scripts
          found=0
          while IFS= read -r -d '' file; do
            found=1
            echo "python3 $file"
            python3 "$file"
          done < <(find . -type f \( -name 'test_*.py' -o -name '*_test.py' -o -name '*.test.py' \) -not -path './.git/*' -print0)
          # Fail hard when the suite silently disappears (glob or rename drift).
          test "$found" -eq 1

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' file; do
            found=1
            echo "bash -n $file"
            bash -n "$file"
          done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
          test "$found" -eq 1

      - name: Validate release manifest transitions
        if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          BASE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || inputs.base_revision }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-surge-release.py --check-transitions "$BASE_REVISION"

      - name: Validate modules and repository invariants
        run: |
          python3 scripts/check-basic-adblock.py
          python3 .github/scripts/check_repository.py
          python3 scripts/verify-surge-release.py

      - name: Check generated rules are reviewed and current
        shell: bash
        run: |
          set -euo pipefail
          if python3 scripts/generate-managed-surge-rules.py --help | grep -q -- '--check'; then
            python3 scripts/generate-managed-surge-rules.py --check --timeout 60
          else
            echo "Generator has no --check mode yet; validating checked-in metadata without fetching upstream."
            python3 .github/scripts/check_repository.py --generated-only
          fi
