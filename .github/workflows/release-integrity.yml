name: Release integrity

on:
  # The create event is evaluated from the default branch, so a newly created
  # tag cannot suppress or replace the verifier workflow stored on main.
  create:
  push:
    tags:
      - "*-self-v*"
  release:
    types: [created, published, prereleased, released, edited, unpublished, deleted]
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: surge-release-integrity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name != 'create' || (github.event.ref_type == 'tag' && contains(github.event.ref, '-self-v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A release tag must never supply the verifier that approves itself.
          # Always run the current verifier from the protected default branch,
          # while fetch-depth 0 makes the pushed tag available to git show.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify tag payload
        if: github.event_name == 'push' || github.event_name == 'create'
        env:
          RELEASE_TAG: ${{ github.event_name == 'create' && github.event.ref || github.ref_name }}
        run: python3 scripts/verify-surge-release.py --tag "$RELEASE_TAG"

      - name: Verify published Release
        if: github.event_name == 'release' && contains(github.event.release.tag_name, '-self-v')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 scripts/verify-surge-release.py --tag "$RELEASE_TAG" --github-release

      - name: Audit all remote releases
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/verify-surge-release.py --check-remote
