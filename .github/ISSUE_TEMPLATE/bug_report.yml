name: Bug report
description: Report a reproducible module, rule, or script problem without sensitive traffic.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not attach raw traffic, packet captures, credentials, cookies, tokens, account data, device identifiers, or private network details. Use a minimal synthetic fixture when response data is needed.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Surge module
        - Response script
        - Rule set
        - Managed-rule generator
        - Documentation or tooling
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Surge, operating system, app, module, and release/tag versions.
      placeholder: "Surge 6.x; iOS 19.x; app 1.2.3; stable tag ..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use sanitized values and synthetic data only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed credentials, account data, private traffic, device identifiers, and network details.
          required: true
