[Rule]
# Managed personal mirrors of selected upstream rulesets.
#
# AUTHORITY: the active Surge profile (iCloud DMIT-Common.dconf) is the single
# source of truth for live routing. This file is a reference template kept
# aligned with it; when the two disagree, the active profile wins. Policy
# names below (us/自动/流媒体/Proxy) mirror the active profile's policies — replace
# them if your profile uses different group names.
# Keep hand-curated personal rules above broad generated rules.

# Personal site pins
RULE-SET,https://raw.githubusercontent.com/mulanshan/surge/main/rule/Surge/douban.list,DIRECT,extended-matching,no-resolve

# AI endpoints must precede broad Microsoft / China / Google rules.
RULE-SET,https://raw.githubusercontent.com/mulanshan/surge/main/rule/Surge/generated/openai.list,us,extended-matching,no-resolve
RULE-SET,https://raw.githubusercontent.com/mulanshan/surge/main/rule/Surge/generated/claude.list,us,extended-matching,no-resolve
RULE-SET,https://raw.githubusercontent.com/mulanshan/surge/main/rule/Surge/ai.list,us,extended-matching,no-resolve

# China / login / system foundations
DOMAIN-SET,https://raw.githubusercontent.com/mulanshan/surge/main/rule/Surge/generated/microsoft.domainset,DIRECT,extended-matching
RULE-SET,https://raw.githubusercontent.com/mulanshan/surge/main/rule/Surge/generated/microsoft.non-domain.list,DIRECT,extended-matching
DOMAIN-SET,https://raw.githubusercontent.com/mulanshan/surge/main/rule/Surge/generated/china-direct.domainset,DIRECT
RULE-SET,https://raw.githubusercontent.com/mulanshan/surge/main/rule/Surge/generated/china-direct.non-domain.list,DIRECT
DOMAIN-SET,https://raw.githubusercontent.com/mulanshan/surge/main/rule/Surge/generated/private-tracker.domainset,DIRECT
RULE-SET,https://raw.githubusercontent.com/mulanshan/surge/main/rule/Surge/generated/private-tracker.non-domain.list,DIRECT

# Apple media must precede the broad Apple DIRECT rules. Surge uses first match.
# Apple mirrors are split by upstream license (GPL-2.0-only vs AGPL-3.0-only).
RULE-SET,https://raw.githubusercontent.com/mulanshan/surge/main/rule/Surge/generated/apple-tv.list,流媒体,extended-matching
RULE-SET,https://raw.githubusercontent.com/mulanshan/surge/main/rule/Surge/generated/apple-bm7.list,DIRECT,extended-matching
RULE-SET,https://raw.githubusercontent.com/mulanshan/surge/main/rule/Surge/generated/apple-sukka.list,DIRECT,extended-matching

# Development / region-pinned services
RULE-SET,https://raw.githubusercontent.com/mulanshan/surge/main/rule/Surge/tmdb.list,Proxy,extended-matching,no-resolve
RULE-SET,https://raw.githubusercontent.com/mulanshan/surge/main/rule/Surge/docker-oci.list,自动,extended-matching,no-resolve

# Major services
RULE-SET,https://raw.githubusercontent.com/mulanshan/surge/main/rule/Surge/generated/telegram.list,Proxy,extended-matching
DOMAIN-SET,https://raw.githubusercontent.com/mulanshan/surge/main/rule/Surge/generated/youtube.domainset,流媒体,extended-matching
RULE-SET,https://raw.githubusercontent.com/mulanshan/surge/main/rule/Surge/generated/youtube.non-domain.list,流媒体,extended-matching,no-resolve
DOMAIN-SET,https://raw.githubusercontent.com/mulanshan/surge/main/rule/Surge/generated/google.domainset,自动,extended-matching
RULE-SET,https://raw.githubusercontent.com/mulanshan/surge/main/rule/Surge/generated/google.non-domain.list,自动,extended-matching
DOMAIN-SET,https://raw.githubusercontent.com/mulanshan/surge/main/rule/Surge/generated/paypal.domainset,自动
RULE-SET,https://raw.githubusercontent.com/mulanshan/surge/main/rule/Surge/generated/paypal.non-domain.list,自动

# Streaming
RULE-SET,https://raw.githubusercontent.com/mulanshan/surge/main/rule/Surge/generated/netflix.list,流媒体
RULE-SET,https://raw.githubusercontent.com/mulanshan/surge/main/rule/Surge/generated/bahamut.list,流媒体
DOMAIN-SET,https://raw.githubusercontent.com/mulanshan/surge/main/rule/Surge/generated/disney.domainset,流媒体
RULE-SET,https://raw.githubusercontent.com/mulanshan/surge/main/rule/Surge/generated/disney.non-domain.list,流媒体
RULE-SET,https://raw.githubusercontent.com/mulanshan/surge/main/rule/Surge/generated/hbo-usa.list,流媒体
RULE-SET,https://raw.githubusercontent.com/mulanshan/surge/main/rule/Surge/generated/prime-video.list,流媒体
DOMAIN-SET,https://raw.githubusercontent.com/mulanshan/surge/main/rule/Surge/generated/streaming.domainset,自动,extended-matching
RULE-SET,https://raw.githubusercontent.com/mulanshan/surge/main/rule/Surge/generated/streaming.non-domain.list,自动,extended-matching

# Broad fallback, keep late
DOMAIN-SET,https://raw.githubusercontent.com/mulanshan/surge/main/rule/Surge/generated/global.domainset,Proxy,extended-matching
RULE-SET,https://raw.githubusercontent.com/mulanshan/surge/main/rule/Surge/generated/global.non-domain.list,Proxy,extended-matching

# IP-family multicast guard (keep after domain rules here; when combined with RULE-SET,LAN in a full profile, place before RULE-SET,LAN)
IP-CIDR,224.0.0.0/4,REJECT-NO-DROP,no-resolve
